# CI (test-gates): runs only when asked. `pnpm prd ci run <tier>` pushes a commit
# to a `ci/<tier>/<name>` ref, and this workflow runs that commit's checks. No
# pull request, no push to dev, staging or main, no schedule.
#
# The tier picks the jobs, each tier including the ones before it
# (scripts/ci/tiers.mjs): static, unit, integration. `components` and `full`
# run those three and say the rest isn't built yet. The last job writes the
# verdict and uploads it as the `verdict` artifact, kept 7 days.
#
# Secrets: none. The test env is fictional and generated per job
# (scripts/ci/env.mjs). The repo is public, so run logs are public.
name: CI

on:
  push:
    branches:
      - "ci/**"

permissions:
  contents: read

# A newer request for the same branch and tier cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARETOOK_LEASES: "off"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      static: ${{ steps.tier.outputs.static }}
      unit: ${{ steps.tier.outputs.unit }}
      integration: ${{ steps.tier.outputs.integration }}
      not_built: ${{ steps.tier.outputs.not_built }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: tier
        name: Read the tier from the ref
        env:
          CI_REF: ${{ github.ref_name }}
        run: node scripts/ci/tiers.mjs "$CI_REF" | tee -a "$GITHUB_OUTPUT"

  static:
    needs:
      - plan
    if: ${{ needs.plan.outputs.static == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      - id: env
        name: Fictional env
        run: node scripts/ci/env.mjs >> "$GITHUB_ENV"
      - id: format
        name: Format
        run: pnpm format:check
      - id: lint
        name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - id: typecheck
        name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - id: docs-budget
        name: Docs budget (a warning)
        if: ${{ !cancelled() }}
        run: pnpm docs:budget

  unit:
    needs:
      - plan
    if: ${{ needs.plan.outputs.unit == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      failures: ${{ steps.report.outputs.failures }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      - id: env
        name: Fictional env and a git identity for the tooling tests
        run: |
          node scripts/ci/env.mjs >> "$GITHUB_ENV"
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - id: test
        name: Unit tests
        run: >-
          pnpm exec vitest run --project data:unit --project web:unit
          --project notifications:unit --project server:unit --project scripts:unit
          --project tooling:unit --reporter=default --reporter=json
          --outputFile.json=ci-results/unit.json
      - id: report
        name: Report the failures
        if: ${{ !cancelled() }}
        run: node scripts/ci/verdict.mjs summarize ci-results/unit.json >> "$GITHUB_OUTPUT"

  integration:
    needs:
      - plan
    if: ${{ needs.plan.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      failures: ${{ steps.report.outputs.failures }}
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: caretook
          POSTGRES_DB: caretook
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5435:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U caretook -d caretook"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      - id: env
        name: Fictional env
        run: node scripts/ci/env.mjs >> "$GITHUB_ENV"
      - id: test
        name: Integration tests
        run: >-
          pnpm exec vitest run --project integration --reporter=default
          --reporter=json --outputFile.json=ci-results/integration.json
      - id: report
        name: Report the failures
        if: ${{ !cancelled() }}
        run: node scripts/ci/verdict.mjs summarize ci-results/integration.json >> "$GITHUB_OUTPUT"

  verdict:
    needs:
      - plan
      - static
      - unit
      - integration
    # Not on a cancelled run: no artifact reads as unknown on the Mac.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: write
        name: Write the verdict
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_TIER: ${{ needs.plan.outputs.tier }}
          CI_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: node scripts/ci/verdict.mjs write ci-results/verdict.json
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict
          path: ci-results/verdict.json
          retention-days: 7
          if-no-files-found: error
