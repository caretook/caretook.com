<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- The share image's source: the lockup (the full logo: mark, name, tagline tucked under it; then the descriptor on two lines).
       og-default.png is rendered from this file by scripts/build/share-image.mjs,
       which supplies the site's typeface. The words match home's hero
       (routes/marketing/home/content.ts) and the alt text in site/meta.ts. -->
  <rect width="1200" height="630" fill="#f5f3ff"/>
  <g transform="translate(96 112) scale(2.5)">
    <rect width="64" height="64" rx="14" fill="#432dd7"/>
    <path d="M32 49C16 39 11 30 14 22.5 17 15.5 27 14.5 32 22c5-7.5 15-6.5 18 .5 3 7.5-2 16.5-18 26.5Z" fill="none" stroke="#e0e7ff" stroke-width="4" stroke-linejoin="round"/>
    <path d="m24 31.5 5.5 5.5L40 26.5" fill="none" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="292" y="212" font-size="124" font-weight="700" letter-spacing="-2" fill="#18181b">Caretook</text>
    <text x="296" y="254" font-size="46" font-weight="400" fill="#432dd7">Care, taken.</text>
    <text x="96" y="410" font-size="46" font-weight="600" fill="#18181b">A shared care journal, made by</text>
